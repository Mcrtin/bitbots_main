# Parameters of the node (display.py)
/**:
  ros__parameters:
    demo: false # true = window on the computer instead of the board (serial_port is ignored); from the command line: --ros-args -p demo:=true
    serial_port: /dev/ttyS4 # must be openable, otherwise the node exits
    baudrate: 115200
    frame_rate: 10.0
