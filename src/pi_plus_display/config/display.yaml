# Parameter der Node (display.py)
/**:
  ros__parameters:
    demo: false # true = Fenster am Rechner statt der Platine (serial_port wird ignoriert); per Kommandozeile: --ros-args -p demo:=true
    serial_port: /dev/ttyS4 # muss sich oeffnen lassen, sonst beendet sich die Node
    baudrate: 115200
    frame_rate: 10.0
