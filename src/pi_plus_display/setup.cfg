[develop]
script_dir=$base/lib/pi_plus_display
[install]
install_scripts=$base/lib/pi_plus_display

[mypy]
python_version = 3.10
strict = True
files = pi_plus_display
# ROS-Pakete und pyserial gibt es hier nicht (Any); luma ist unser Fremdcode ohne Typen
ignore_missing_imports = True
disallow_subclassing_any = False

[mypy-luma.*]
follow_imports = skip
