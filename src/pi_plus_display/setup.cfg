[develop]
script_dir=$base/lib/pi_plus_display
[install]
install_scripts=$base/lib/pi_plus_display

[mypy]
python_version = 3.10
strict = True
files = pi_plus_display
# ROS packages and pyserial are not available here (Any); luma is our vendored third-party code without types
ignore_missing_imports = True
disallow_subclassing_any = False

[mypy-luma.*]
follow_imports = skip
